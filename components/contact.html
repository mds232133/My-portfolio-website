<div class="contact-layout section-wrap">
  <div class="contact-intro section-heading">
    <p class="eyebrow">Get in touch</p>
    <h2>Let's Work Together</h2>
    <p>Have a project in mind or just want to say hello?<br />Feel free to reach out!</p>
  </div>
  <div class="contact-details">
    <a href="mailto:shipon@example.com" class="contact-detail"><span>✉</span><span><b>shipon@example.com</b><small>Send me an email</small></span></a>
    <a href="tel:+8801712345678" class="contact-detail"><span>⌕</span><span><b>+880 1712 345678</b><small>Call me anytime</small></span></a>
    <div class="contact-detail"><span>⌖</span><span><b>Dhaka, Bangladesh</b><small>Located in Bangladesh</small></span></div>
  </div>
  <form class="contact-form" novalidate>
    <div class="form-row"><label class="visually-hidden" for="contact-name">Your name</label><input id="contact-name" name="name" autocomplete="name" placeholder="Your Name" required minlength="2" /><label class="visually-hidden" for="contact-email">Your email</label><input id="contact-email" name="email" type="email" autocomplete="email" placeholder="Your Email" required /></div>
    <label class="visually-hidden" for="contact-message">Your message</label><textarea id="contact-message" name="message" placeholder="Message" rows="4" required minlength="10"></textarea>
    <button class="button button-primary" type="submit">Send Message <span aria-hidden="true">➤</span></button>
    <p class="form-feedback" aria-live="polite"></p>
  </form>
</div>
